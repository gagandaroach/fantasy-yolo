[project]
name = "fantasy-yolo"
version = "0.1.0"
description = "MCP server and CLI for your own ESPN Fantasy Football team"
readme = "README.md"
authors = [
    { name = "gagan", email = "gagandaroach@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "espn-api>=0.46.0",
    "mcp>=2.2,<3",
    "pydantic>=2.13.5",
    "typer>=0.27.2",
]

[project.scripts]
fy = "fantasy_yolo.cli:main"
fantasy-yolo-mcp = "fantasy_yolo.mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Network tests are opt-in: the default suite runs with no credentials and no
# network (M-03). Run them with `-m network`.
addopts = "-m 'not network'"
markers = ["network: talks to ESPN; unauthenticated and side-effect free"]
