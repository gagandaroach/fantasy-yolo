[project]
name = "fantasy-yolo"
version = "0.1.0"
description = "MCP server and CLI for your own ESPN Fantasy Football team"
readme = "README.md"
authors = [
    { name = "gagan", email = "gagandaroach@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.2,<3",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "typer>=0.27.2",
]

[project.scripts]
fy = "fantasy_yolo.cli:main"
fantasy-yolo-mcp = "fantasy_yolo.mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "requests-mock>=1.12.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
# Vendored upstream code (MIT, Christian Wendt). Kept close to upstream so
# changes stay reviewable and future merges stay possible; not restyled to our
# lint rules. Our own fixes to it are marked "fantasy-yolo:".
extend-exclude = ["src/fantasy_yolo/espn", "tests/vendored"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Network tests are opt-in: the default suite runs with no credentials and no
# network (M-03). Run them with `-m network`.
addopts = "-m 'not network' --ignore=tests/vendored/football/integration --ignore=tests/vendored/basketball/integration --ignore=tests/vendored/hockey/integration --ignore=tests/vendored/baseball/integration --ignore=tests/vendored/wbasketball/integration"
markers = ["network: talks to ESPN; unauthenticated and side-effect free"]
